(function installStoryPlayer(story,doc){const win=doc.defaultView,stage=doc.getElementById('stage'),seek=doc.getElementById('seek'),playButton=doc.getElementById('play'),media=win.matchMedia?.('(prefers-reduced-motion: reduce)');let at=0,raf=0,playing=false,begin=0;
